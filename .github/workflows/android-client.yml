name: Android client

on:
  push:
    branches: [main]
    tags: ['mobile-v*']
    paths:
      - "android-client/**"
      - ".github/workflows/android-client.yml"
  pull_request:
    paths:
      - "android-client/**"
      - ".github/workflows/android-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify mobile tag
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e 'if (process.env.RELEASE_TAG !== "mobile-v" + JSON.parse(require("fs").readFileSync("package.json", "utf8")).version) process.exit(1)'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: android-client/pnpm-lock.yaml

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check and test
        run: pnpm test

      - name: Build web assets and sync Capacitor
        run: pnpm android:sync

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 components
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Debug APK
        run: cd android && chmod +x gradlew && ./gradlew testDebugUnitTest assembleDebug --no-daemon --max-workers=2

      - name: Create APK checksum
        run: cd android/app/build/outputs/apk/debug && sha256sum app-debug.apk > app-debug.apk.sha256

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: easy-panel-mobile-debug
          path: |
            android-client/android/app/build/outputs/apk/debug/app-debug.apk
            android-client/android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: debug-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: easy-panel-mobile-debug
          path: release-assets
      - name: Publish tested Debug APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Easy Panel Android $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md" --latest=false
          elif gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | grep -qx 'app-debug.apk'; then
            echo 'A reviewed APK already exists; keeping its signing certificate and assets.'
            exit 0
          fi
          gh release upload "$RELEASE_TAG" release-assets/*
